[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "1.2.0"

[workspace.dependencies]
asdcplib = { git = "https://github.com/PostPerfection/asdcplib-rs.git", rev = "6d044c1" }
clap = { version = "4", features = ["derive"] }
dcpdoctor-core = { git = "https://github.com/PostPerfection/dcpdoctor.git", rev = "0e00184" }
postkit = { path = "../extern/postkit", features = ["grok-ffi", "tms"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# dcpdoctor-core depends on postkit by git. pointing that at the submodule this
# workspace already builds keeps postkit to one compile instead of two.
[patch."https://github.com/PostPerfection/postkit.git"]
postkit = { path = "../extern/postkit" }
