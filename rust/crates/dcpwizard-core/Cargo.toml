[package]
name = "dcpwizard-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DCP Wizard — Digital Cinema Package creation library"

[dependencies]
asdcplib.workspace = true
base64 = "0.22"
chrono = "0.4"
dcpdoctor-core.workspace = true
dirs = "6"
hound = "3.5"
getrandom = "0.2"
libc = "0.2"
libaaf-sys = { path = "../libaaf-sys" }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "webpki-roots"] }
postkit.workspace = true
roxmltree = "0.20"
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
# sftp for tms upload. 0.9.6 is the first release whose vendored libssh2 carries
# the CVE-2026-55200 fix, so do not float below it.
ssh2 = "0.9.6"
suppaftp = "10"
tempfile = "3"
thiserror.workspace = true
time = "0.3"
toml = "1"
tracing.workspace = true
uuid.workspace = true
zip = "8"

[dev-dependencies]
tempfile = "3"
