name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-2022
            name: Windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxml2-dev \
            libxml2-utils \
            libssl-dev \
            libxerces-c-dev \
            xmlsec1 \
            fonts-dejavu-core \
            e2fsprogs

      # apt's 6.1 and chocolatey's have no apv decoder, so linux and windows take
      # the same pinned 8.1 static build
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1.tar.xz
          tar -xJf ffmpeg.tar.xz
          echo "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libxml2 openssl@3 xerces-c libxmlsec1
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$OPENSSL_PREFIX" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$OPENSSL_PREFIX/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PREFIX/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$OPENSSL_PREFIX/lib:$(brew --prefix xerces-c)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix xerces-c)/lib/pkgconfig" >> $GITHUB_ENV

      # homebrew's ffmpeg carries no libass or freetype, so the subtitle burn
      # tests get "No such filter: subtitles"
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: ffmpeg
          create-args: ffmpeg=8.1.1=gpl_h4b93310_102
          init-shell: none

      - name: Put ffmpeg on PATH (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "$(dirname "$("${MAMBA_EXE:-micromamba}" run -n ffmpeg which ffmpeg)")" >> "$GITHUB_PATH"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:VCPKG_BUILD_TYPE="release"
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install libxml2[tools] openssl xerces-c --triplet x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools\libxml2" >> $env:GITHUB_PATH

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1.zip
          unzip -q ffmpeg.zip
          echo "$(cygpath -w "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1/bin")" >> "$GITHUB_PATH"

      - name: Install xmlsec1 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          /c/msys64/usr/bin/pacman.exe -Sy --noconfirm --needed mingw-w64-x86_64-xmlsec
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1
        with:
          grok-ref: v20.4.0

      - name: Check test tools
        shell: bash
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          xmllint --version
          grk_compress -h > /dev/null
          grk_decompress -h > /dev/null
          xmlsec1 --version
          if [ "$RUNNER_OS" = "Linux" ]; then mkfs.ext2 -V; fi

      - name: Build
        working-directory: rust
        run: cargo build --release

      - name: Test
        working-directory: rust
        run: cargo test --workspace

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: CLI flag consistency
        if: runner.os == 'Linux'
        run: bash tests/cli_flags_test.sh ./rust/target/release/dcpwizard

      - uses: astral-sh/setup-uv@v6

      - name: CLI tests
        shell: bash
        run: PATH="$PWD/rust/target/release:$PATH" uv run --no-project --with pytest pytest tests/test_cli.py -q

  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev xvfb

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1
        with:
          grok-ref: v20.4.0

      - uses: PostPerfection/setup-libmpv@v1
        with:
          mpv-release: 20260828
          mpv-archive: mpv-dev-x86_64-20260828-git-182fa6ca49.7z

      - name: Build frontend
        working-directory: gui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build CLI sidecar
        working-directory: rust
        run: |
          cargo build --release -p dcpwizard-cli
          TRIPLE=$(rustc -vV | grep host | awk '{print $2}')
          cp target/release/dcpwizard ../gui/src-tauri/dcpwizard-${TRIPLE}

      - name: Build the GUI
        run: cargo build --release --manifest-path gui/src-tauri/Cargo.toml

      - uses: astral-sh/setup-uv@v6

      - name: GUI tests
        run: xvfb-run -a uv run --no-project --with pytest pytest tests/test_gui.py -q
