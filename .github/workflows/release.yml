name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            artifact: dcpwizard-linux-x86_64
            binary: dcpwizard
          - os: macos-latest
            name: macos
            artifact: dcpwizard-macos-aarch64
            binary: dcpwizard
          - os: windows-2022
            name: windows
            artifact: dcpwizard-windows-x86_64
            binary: dcpwizard.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxml2-dev \
            libssl-dev \
            libxerces-c-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libxml2 openssl@3 xerces-c
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$OPENSSL_PREFIX" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$OPENSSL_PREFIX/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PREFIX/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$OPENSSL_PREFIX/lib:$(brew --prefix xerces-c)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix xerces-c)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:VCPKG_BUILD_TYPE="release"
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install libxml2 openssl xerces-c --triplet x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # build grok (jpeg 2000 codec) from source once per tag, cached.
      # provides libgrokj2k on the pkg-config + loader paths and grk_compress on PATH.
      - name: Cache grok
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/grok-install
          key: grok-${{ runner.os }}-v20.3.10

      - name: Setup grok
        if: runner.os != 'Windows'
        env:
          GROK_TAG: v20.3.10
        run: |
          prefix="$GITHUB_WORKSPACE/grok-install"
          if [ ! -x "$prefix/bin/grk_compress" ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$GROK_TAG" \
              https://github.com/GrokImageCompression/grok.git "$RUNNER_TEMP/grok-src"
            cmake -S "$RUNNER_TEMP/grok-src" -B "$RUNNER_TEMP/grok-build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
            cmake --build "$RUNNER_TEMP/grok-build" --parallel "$(getconf _NPROCESSORS_ONLN)"
            cmake --install "$RUNNER_TEMP/grok-build"
          fi
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib:$prefix/lib64:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$prefix/lib:$prefix/lib64:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      # windows: msvc build mirroring grok's own ci (x64 generator, no libcurl);
      # pkgconfiglite provides pkg-config for grokj2k-sys and the runner's LLVM
      # provides libclang for bindgen.
      - name: Setup grok (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GROK_TAG: v20.3.10
        run: |
          # choco puts its shim directory on the machine PATH, which this
          # already-running bash cannot see, so add it by hand
          choco_bin="$(cygpath -u "${ChocolateyInstall:-C:/ProgramData/chocolatey}")/bin"
          export PATH="$choco_bin:$PATH"
          echo "$(cygpath -w "$choco_bin")" >> "$GITHUB_PATH"
          # choco sometimes reports success while installing nothing, so gate
          # the retries on pkg-config actually answering, not choco's exit code
          for attempt in 1 2 3 4 5; do
            pkg-config --version >/dev/null 2>&1 && break
            choco install -y --no-progress --force pkgconfiglite || true
            hash -r
            pkg-config --version >/dev/null 2>&1 && break
            if [ "$attempt" = 5 ]; then
              echo "pkg-config still missing after $attempt pkgconfiglite installs." >&2
              echo "$choco_bin holds:" >&2
              ls -1 "$choco_bin" >&2 || echo "  (no such directory)" >&2
              exit 1
            fi
            sleep $((30 * attempt))
          done
          prefix="$(cygpath -m "$GITHUB_WORKSPACE")/grok-install"
          if [ ! -f "$prefix/bin/grokj2k.dll" ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$GROK_TAG" \
              https://github.com/GrokImageCompression/grok.git "$RUNNER_TEMP/grok-src"
            cmake -S "$RUNNER_TEMP/grok-src" -B "$RUNNER_TEMP/grok-build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
              -DCMAKE_GENERATOR_PLATFORM=x64 -DGRK_ENABLE_LIBCURL=OFF \
              -DGRK_BUILD_PKGCONFIG_FILES=ON -DGRK_BUILD_CORE_SWIG_BINDINGS=OFF
            cmake --build "$RUNNER_TEMP/grok-build" --config Release --parallel 4
            cmake --install "$RUNNER_TEMP/grok-build" --config Release
          fi
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$prefix")\\bin" >> "$GITHUB_PATH"

      - name: Build release
        working-directory: rust
        env:
          OPENSSL_STATIC: "1"
        run: cargo build --release

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip rust/target/release/${{ matrix.binary }}

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip rust/target/release/${{ matrix.binary }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp rust/target/release/${{ matrix.binary }} dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "rust/target/release/${{ matrix.binary }}" "dist/"
          # the exe links grokj2k.dll at load time, so ship it alongside
          Copy-Item "$env:GITHUB_WORKSPACE/grok-install/bin/grokj2k.dll" "dist/"
          Compress-Archive -Path "dist/*" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  deb:
    runs-on: ubuntu-24.04
    name: Build .deb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev
          cargo install cargo-deb

      # build grok (jpeg 2000 codec) from source once per tag, cached.
      # provides libgrokj2k on the pkg-config + loader paths and grk_compress on PATH.
      - name: Cache grok
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/grok-install
          key: grok-${{ runner.os }}-v20.3.10

      - name: Setup grok
        if: runner.os != 'Windows'
        env:
          GROK_TAG: v20.3.10
        run: |
          prefix="$GITHUB_WORKSPACE/grok-install"
          if [ ! -x "$prefix/bin/grk_compress" ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$GROK_TAG" \
              https://github.com/GrokImageCompression/grok.git "$RUNNER_TEMP/grok-src"
            cmake -S "$RUNNER_TEMP/grok-src" -B "$RUNNER_TEMP/grok-build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
            cmake --build "$RUNNER_TEMP/grok-build" --parallel "$(getconf _NPROCESSORS_ONLN)"
            cmake --install "$RUNNER_TEMP/grok-build"
          fi
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib:$prefix/lib64:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$prefix/lib:$prefix/lib64:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Build .deb package
        working-directory: rust
        env:
          OPENSSL_STATIC: "1"
        run: cargo deb -p dcpwizard-cli

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcpwizard-deb
          path: rust/target/debian/*.deb

  release:
    needs: [build, deb]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.deb
