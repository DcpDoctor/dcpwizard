name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            artifact: dcpwizard-linux-x86_64
            binary: dcpwizard
          - os: macos-latest
            name: macos
            artifact: dcpwizard-macos-aarch64
            binary: dcpwizard
          - os: windows-2022
            name: windows
            artifact: dcpwizard-windows-x86_64
            binary: dcpwizard.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxml2-dev \
            libssl-dev \
            libxerces-c-dev \
            patchelf

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libxml2 openssl@3 xerces-c
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$OPENSSL_PREFIX" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$OPENSSL_PREFIX/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PREFIX/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$OPENSSL_PREFIX/lib:$(brew --prefix xerces-c)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix xerces-c)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:VCPKG_BUILD_TYPE="release"
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install libxml2 openssl xerces-c --triplet x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1
        with:
          grok-ref: v20.4.6

      - name: Build release
        working-directory: rust
        env:
          OPENSSL_STATIC: "1"
        run: cargo build --release

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip rust/target/release/${{ matrix.binary }}

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip rust/target/release/${{ matrix.binary }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/lib
          cp rust/target/release/${{ matrix.binary }} dist/
          for candidate in "$GITHUB_WORKSPACE/grok-install/lib64" "$GITHUB_WORKSPACE/grok-install/lib"; do
            if [ -d "$candidate" ]; then GROK_LIB="$candidate"; break; fi
          done
          if [ -z "${GROK_LIB:-}" ]; then
            echo "no grok library directory under grok-install"
            exit 1
          fi
          # the binary links libgrokj2k at load time, so the archive carries it
          # and looks for it beside itself instead of on LD_LIBRARY_PATH
          if [ "$RUNNER_OS" = "Linux" ]; then
            for lib in $(readelf -d dist/${{ matrix.binary }} | sed -n 's/.*NEEDED.*\[\(libgrok[^]]*\)\].*/\1/p'); do
              cp -L "$GROK_LIB/$lib" "dist/lib/$lib"
            done
            patchelf --set-rpath '$ORIGIN/lib' dist/${{ matrix.binary }}
          else
            for reference in $(otool -L dist/${{ matrix.binary }} | awk '/libgrok/ {print $1}'); do
              name=$(basename "$reference")
              cp -L "$GROK_LIB/$name" "dist/lib/$name"
              install_name_tool -id "@rpath/$name" "dist/lib/$name"
              install_name_tool -change "$reference" "@rpath/$name" dist/${{ matrix.binary }}
              codesign --force --sign - "dist/lib/$name"
            done
            install_name_tool -add_rpath '@loader_path/lib' dist/${{ matrix.binary }}
            # every install_name_tool edit breaks the signature arm64 requires
            codesign --force --sign - dist/${{ matrix.binary }}
          fi
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "rust/target/release/${{ matrix.binary }}" "dist/"
          # the exe links grokj2k.dll at load time, so ship it alongside
          Copy-Item "$env:GITHUB_WORKSPACE/grok-install/bin/grokj2k.dll" "dist/"
          Compress-Archive -Path "dist/*" -DestinationPath "${{ matrix.artifact }}.zip"

      # what a user does with the download: unpack it and run it, with nothing
      # pointing the loader at a grok install
      - name: The unpacked archive runs on its own (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked
          tar -xzf ${{ matrix.artifact }}.tar.gz -C unpacked
          cd unpacked
          env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            ./${{ matrix.binary }} --version

      - name: The unpacked archive runs on its own (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path unpacked
          Expand-Archive -Path "${{ matrix.artifact }}.zip" -DestinationPath unpacked
          & "unpacked/${{ matrix.binary }}" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  deb:
    runs-on: ubuntu-24.04
    name: Build .deb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev
          cargo install cargo-deb

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1
        with:
          grok-ref: v20.4.6

      - name: Build .deb package
        working-directory: rust
        env:
          OPENSSL_STATIC: "1"
        run: cargo deb -p dcpwizard-cli

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcpwizard-deb
          path: rust/target/debian/*.deb

  release:
    needs: [build, deb]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.deb
